<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body { margin:0; padding:0; background:#0e1019; }
  .kickr{font-size:13px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:#d2cefd}
  .wm{font-weight:600;letter-spacing:-.03em;line-height:.9;color:#e9e9ed}
  .accent{color:#d2cefd}
  * { font-family:'Inter',system-ui,sans-serif; }
</style>
</head>
<body>

<div id="card" style="position:relative;width:1200px;height:627px;overflow:hidden;border-radius:6px;background:radial-gradient(90% 150% at 78% 30%,#1b1e30 0%,#141626 52%,#0d0f1a 100%);color:#e9e9ed">
  <div style="position:absolute;inset:0;background-image:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:72px 72px"></div>
  <div style="position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,transparent,#9184d9 22%,#9184d9 78%,transparent)"></div>

  <div style="position:absolute;left:56px;top:44px;display:flex;align-items:center;gap:13px">
    <div style="position:relative;width:52px;height:52px;display:flex;align-items:center;justify-content:center">
      <div style="position:absolute;inset:-5px;border-radius:50%;box-shadow:0 0 0 1px #4a4470"></div>
      <img src="../assets/mark.png" alt="Ordo7" style="height:36px;width:auto">
    </div>
    <span class="wm" style="font-size:28px">Ordo7</span>
  </div>

  <div style="position:absolute;right:56px;top:82px;width:300px;height:462px">
    <div style="position:absolute;inset:-34px;border-radius:22px;background:radial-gradient(circle at 50% 40%,#9184d9 0%,transparent 62%)"></div>
    <div style="position:absolute;inset:0;border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px #4a4470;background:#0d0f1a url(../assets/ceo-portrait.png) 50% 0%/cover no-repeat"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:42%;border-radius:0 0 16px 16px;background:linear-gradient(0deg,#0d0f1acc,transparent)"></div>
    <div style="position:absolute;left:18px;bottom:16px">
      <div style="font-size:18px;font-weight:500;color:#e9e9ed">Taj Young</div>
      <div style="font-size:12px;color:#b2b6ca;letter-spacing:.03em">Founder &amp; Developer</div>
    </div>
  </div>

  <div style="position:absolute;left:60px;top:50%;transform:translateY(-46%);width:640px;display:flex;flex-direction:column;gap:20px">
    <div class="kickr">{{KICKER}}</div>
    <div style="font-size:{{HEADLINE_SIZE}}px;font-weight:500;line-height:1.05;letter-spacing:-.025em">{{HEADLINE}}</div>
    <div style="font-size:18px;color:#b2b6ca;line-height:1.5;max-width:520px">{{BODY}}</div>
    <div style="margin-top:6px;position:relative;display:inline-flex;align-self:flex-start;overflow:hidden;border:1px solid #9184d9;border-radius:10px">
      <div style="display:inline-flex;align-items:center;gap:10px;padding:14px 24px;color:#e9e9ed;font-size:18px;font-weight:600;letter-spacing:-.01em">Follow the journey <span class="accent">→ ordo7.pro</span></div>
    </div>
  </div>
</div>

</body>
</html>
