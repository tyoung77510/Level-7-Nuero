<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Inter';
    src: local('Inter');
  }
  html,body { margin:0; padding:0; background:#0e1019; }
  @keyframes gridDrift { from { background-position:0 0,0 0; } to { background-position:96px 96px,96px 96px; } }
  .kickr{font-size:15px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#d2cefd}
  .wm{font-weight:600;letter-spacing:-.03em;line-height:.9;color:#e9e9ed}
  .accent{color:#d2cefd}
  * { font-family:'Inter',system-ui,sans-serif; }
</style>
</head>
<body>

<div id="card" style="position:relative;width:1200px;height:1500px;overflow:hidden;border-radius:6px;background:radial-gradient(90% 110% at 24% 20%,#1b1e30 0%,#141626 52%,#0d0f1a 100%);color:#e9e9ed">
  <div style="position:absolute;inset:0;background-image:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:96px 96px"></div>
  <div style="position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,transparent,#9184d9 22%,#9184d9 78%,transparent)"></div>

  <!-- wordmark -->
  <div style="position:absolute;left:88px;top:96px;display:flex;align-items:center;gap:16px">
    <div style="position:relative;width:64px;height:64px;display:flex;align-items:center;justify-content:center">
      <div style="position:absolute;inset:-6px;border-radius:50%;box-shadow:0 0 0 1px #4a4470"></div>
      <img src="../assets/mark.png" alt="Ordo7" style="height:44px;width:auto">
    </div>
    <span class="wm" style="font-size:34px">Ordo7</span>
  </div>

  <!-- portrait: left variant -->
  <div data-portrait="left" style="display:{{PORTRAIT_LEFT_DISPLAY}};position:absolute;left:88px;top:230px;width:404px;height:400px">
    <div style="position:absolute;inset:-40px;border-radius:24px;background:radial-gradient(circle at 50% 40%,#9184d9 0%,transparent 62%)"></div>
    <div style="position:absolute;inset:0;border-radius:18px;overflow:hidden;box-shadow:0 0 0 1px #4a4470;background:#0d0f1a url(../assets/ceo-portrait.png) 50% 0%/cover no-repeat"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:42%;border-radius:0 0 18px 18px;background:linear-gradient(0deg,#0d0f1acc,transparent)"></div>
    <div style="position:absolute;left:22px;bottom:20px">
      <div style="font-size:22px;font-weight:500;color:#e9e9ed">Taj Young</div>
      <div style="font-size:14px;color:#b2b6ca;letter-spacing:.03em">Founder &amp; Developer</div>
    </div>
  </div>

  <!-- portrait: right variant -->
  <div data-portrait="right" style="display:{{PORTRAIT_RIGHT_DISPLAY}};position:absolute;right:96px;top:110px;width:340px;height:440px">
    <div style="position:absolute;inset:-36px;border-radius:22px;background:radial-gradient(circle at 50% 40%,#9184d9 0%,transparent 62%)"></div>
    <div style="position:absolute;inset:0;border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px #4a4470;background:#0d0f1a url(../assets/ceo-portrait.png) 50% 0%/cover no-repeat"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:44%;border-radius:0 0 16px 16px;background:linear-gradient(0deg,#0d0f1acc,transparent)"></div>
    <div style="position:absolute;left:20px;bottom:18px">
      <div style="font-size:20px;font-weight:500;color:#e9e9ed">Taj Young</div>
      <div style="font-size:13px;color:#b2b6ca;letter-spacing:.03em">Founder &amp; Developer</div>
    </div>
  </div>

  <!-- text block: fixed top so it clears both a 1-line and 2-line headline consistently across all 90 days -->
  <div style="position:absolute;left:88px;top:660px;width:1024px;display:flex;flex-direction:column;gap:30px">
    <div class="kickr">{{KICKER}}</div>
    <div style="font-size:{{HEADLINE_SIZE}}px;font-weight:500;line-height:1.03;letter-spacing:-.025em">{{HEADLINE}}</div>
    <div style="font-size:26px;color:#b2b6ca;line-height:1.5;max-width:980px">{{BODY}}</div>
    <div style="margin-top:14px;position:relative;display:inline-flex;align-self:flex-start;overflow:hidden;border:1px solid #9184d9;border-radius:10px">
      <div style="display:inline-flex;align-items:center;gap:12px;padding:20px 34px;color:#e9e9ed;font-size:25px;font-weight:600;letter-spacing:-.01em">Try It For Free <span class="accent">→ ordo7.pro</span></div>
    </div>
  </div>

  <div style="position:absolute;left:88px;bottom:88px;display:flex;align-items:center;gap:14px">
    <span style="width:9px;height:9px;border-radius:50%;background:#9184d9"></span>
    <span style="font-size:17px;color:#75798c;letter-spacing:.03em">{{FOOTER}}</span>
  </div>
</div>

</body>
</html>
